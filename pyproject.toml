[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-anomaly"
version = "0.1.0"
description = "Glaucoma screening from fundus images: healthy-only autoencoder + cup-to-disc ratio fusion"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.3", "opencv-python-headless>=4.9",
  "pyyaml>=6.0", "flask>=3.0", "torch>=2.2", "torchvision>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
